name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
      - run: gofmt -l . | tee /dev/stderr | (! read -r _)
      - run: go vet ./...
      - run: go test ./...
      - run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/omenight-agent
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./cmd/omenight-relay
